[project]
name = "fast-api-monolith-example"
version = "0.1.0"
description = "Example for fast api monolith architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.0",
    "mypy>=2.4.0",
    "psycopg>=3.3.6",
    "pwdlib>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "ruff>=0.16.10",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.38.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Varsayılan kurallar (E4, E7, E9, F) zaten açık; bunlar üstüne ekliyoruz.
extend-select = [
    "I",   # isort - import sıralama/gruplama
    "UP",  # pyupgrade - eski Python syntax'ını modernize et
    "B",   # flake8-bugbear - olası mantık hataları
    "SIM", # flake8-simplify - gereksiz karmaşık kod
    "N",   # pep8-naming - isimlendirme kuralları
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["\\.venv"]
